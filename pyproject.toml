[project]
name = "pader-automated-report-generator"
version = "1.0.0"
description = "Deterministic ICSR analysis with controlled LLM narrative generation for PADER-style safety reports."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = []

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501"]

[tool.coverage.run]
source = ["src"]
omit = ["src/analysis.py"]

[tool.coverage.report]
fail_under = 0
